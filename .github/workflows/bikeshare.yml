name: Bikeshare commute recorder
on:
  schedule:
    - cron: '17 16 * * *'
      timezone: America/New_York
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bikeshare.yml'
      - 'scripts/bikeshare/collect.py'

concurrency:
  group: bikeshare-commute-recorder
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/bikeshare/collect.py --check

  record:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Open the data branch
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/bikeshare-replays; then
            git fetch --depth=1 origin refs/heads/bikeshare-replays
            git worktree add --detach "$RUNNER_TEMP/replays" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/replays" HEAD
            git -C "$RUNNER_TEMP/replays" checkout --orphan initial-data
            git -C "$RUNNER_TEMP/replays" rm -rf --quiet .
          fi
      - name: Collect the evening session
        if: github.event_name == 'schedule'
        run: python3 scripts/bikeshare/collect.py --out "$RUNNER_TEMP/replays"
      - name: Collect a session now
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/bikeshare/collect.py --minutes 65 --out "$RUNNER_TEMP/replays"
      - name: Publish the replay and index together
        run: |
          cd "$RUNNER_TEMP/replays"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh recorded commute'
            git push origin HEAD:refs/heads/bikeshare-replays
          fi
